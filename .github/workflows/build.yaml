name: Python package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["pypy3.11"]

    steps:
      # Checkout repository
      - uses: actions/checkout@v5

      # Setup Python interpreter
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip packages to speed up workflow
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}

      # Install dependencies (Ruff included)
      - name: Install dependencies
        run: pip install --upgrade pip ruff

      # Lint code with Ruff (target version py311 for PyPy 3.11)
      - name: Lint code with Ruff
        run: ruff check --output-format=github --target-version=py311

      # Check code formatting (diff only, do not fail workflow)
      - name: Check code formatting with Ruff
        run: ruff format --diff --target-version=py311
        continue-on-error: true
